[package]
name = "axum-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
vespera = { path = "../../crates/vespera", features = ["cron", "cron-tz"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.7", features = ["cors"] }
# `Stream` for the `Sse` demo in `routes/events.rs`.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sea-orm = { version = "^2.0.4", features = ["sqlx-sqlite", "runtime-tokio", "macros", "with-uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
# `url::Url` field in `routes/network.rs` (documented as `string`/`uri`).
url = { version = "2", features = ["serde"] }
# `#[derive(garde::Validate)]` + `#[garde(context(..))]` for the
# `ValidatedWith` demo in `routes/validated.rs` (context-aware rules are
# garde's own derive; `#[derive(Schema)]` rules need no garde dependency).
garde = { version = "0.23", features = ["derive"] }

third = { path = "../third" }

[dev-dependencies]
testkit = { path = "../testkit" }
insta = "1.49"
rstest = "0.28"

