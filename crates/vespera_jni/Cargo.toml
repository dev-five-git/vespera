[package]
name = "vespera_jni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "JNI bridge for vespera — call Rust axum apps from Java"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vespera_jni"
readme.workspace = true
keywords = ["jni", "java", "axum", "spring", "vespera"]
categories = ["api-bindings", "web-programming::http-server"]

[dependencies]
vespera_inprocess = { workspace = true, features = ["connect-info", "runtime"] }
jni = "0.22"
# `time`: the shared runtime must run a timer driver — the per-dispatch
# deadline (`VESPERA_DISPATCH_TIMEOUT_MS`) and the bounded request-producer
# join are timer-based.  (`vespera_inprocess` already enables it.)
tokio = { version = "1.44", features = ["rt-multi-thread", "time"] }
# `FutureExt::catch_unwind` for the async dispatch panic-isolation path
# (replaces a redundant second `tokio::spawn`).  Already in the workspace
# dependency tree via tokio/axum/tower, so this adds no new crate to the
# build — only `std` is needed for the `catch_unwind` combinator.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Optional high-performance global allocator for the final cdylib.
# Opt-in because #[global_allocator] is process-wide and must be the
# embedding crate's decision.
mimalloc = { version = "0.1.43", optional = true }

[dev-dependencies]
# Shared-runtime regression test routes (test-only, never in the cdylib).
axum = { version = "0.8.4", default-features = false, features = ["tokio"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "sync", "time"] }
rstest = "0.28"

[features]
# Use mimalloc as the global allocator inside the JNI cdylib.  The
# default OS allocator (Windows HeapAlloc in particular) is measurably
# slower on the allocation-heavy dispatch paths (input Vec, response
# collect, wire response, streaming chunks).
mimalloc = ["dep:mimalloc"]

[lints]
workspace = true
