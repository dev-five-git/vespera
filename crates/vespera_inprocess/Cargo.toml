[package]
name = "vespera_inprocess"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "In-process HTTP dispatch for axum — drive a Router via oneshot without a TCP socket"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vespera_inprocess"
readme.workspace = true
keywords = ["axum", "in-process", "ffi", "dispatch", "vespera"]
categories = ["web-programming::http-server", "network-programming"]

[package.metadata.docs.rs]
# Document the feature-gated `ffi` (C ABI) and `runtime` modules and badge
# them with the feature that enables them (`doc(cfg)`). Not `all-features`:
# `bench-support` is a `#[doc(hidden)]` criterion scaffold, not API.
features = ["connect-info", "tracing", "runtime", "ffi"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Compiles the criterion A/B "before" twins (serde-based wire header
# parse/serialize, the `http::request::Builder` request build, the
# `serde_json::Value` 422 hoist) and the `bench_support` surface that
# `benches/dispatch.rs` calls.  OFF by default so production builds (and
# the shipped JNI cdylib) never compile the serde wire-header scaffolding
# that exists only to benchmark the hand-rolled production path against.
# Enable with `cargo bench -p vespera_inprocess --features bench-support`.
bench-support = []
# Inserts the optional `remote_addr` wire field as an
# `axum::extract::ConnectInfo<SocketAddr>` request extension.  The type is
# gated behind axum's `tokio` feature, which also turns on `tokio/net`;
# `vespera` and `vespera_jni` already enable it, so real builds compile
# nothing extra.  Kept opt-in so a standalone build (the criterion gate's
# `cargo bench -p vespera_inprocess`) keeps the runtime it has always measured.
connect-info = ["axum/tokio"]
# Structured `tracing` instrumentation: a `vespera.dispatch` span per wire
# dispatch (mode / method / route / app / status / duration_ms / panicked) and
# WARN/ERROR events for synthesised error responses (400 / 413 / 431 / 503 /
# 504 / engine 5xx) and panics.  OFF by default: without it the crate has no
# `tracing` dependency and the dispatch paths compile exactly as before.
tracing = ["dep:tracing", "axum/matched-path"]
# The shared multi-thread host runtime (`vespera_inprocess::runtime`): lazy
# build, in-flight leases, deferred hooks, graceful irreversible shutdown.
# Used by the JNI bridge (`vespera_jni`) and the C ABI (`ffi`).
runtime = ["tokio/rt-multi-thread"]
# Stable C ABI (`vespera_inprocess::ffi`, header `include/vespera.h`):
# `vespera_dispatch` / `vespera_dispatch_into` / `vespera_dispatch_async` /
# `vespera_free` / `vespera_shutdown` exported from the cdylib, plus the
# `ffi_app!` / `ffi_apps!` macros emitting `vespera_init`.
ffi = ["runtime"]

[dependencies]
# Lock-free read snapshot for the multi-app router registry: named-app
# dispatch (every request in a multi-app JNI deployment) resolves with a
# single atomic load instead of an `RwLock` read acquisition, matching
# the lock-free fast path the default app already enjoys.  Registration
# (startup-only, first-wins) goes through copy-on-write `rcu`.
arc-swap = "1"
axum = { version = "0.8", default-features = false }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `time`: the optional per-dispatch deadline (`set_dispatch_timeout`) and the
# bounded request-producer join on the bidirectional streaming paths.
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# `FutureExt::catch_unwind` for the `async_spawn_pattern` bench, which
# A/Bs the vespera_jni `dispatchAsync` spawn-mechanism change (inner
# `tokio::spawn` vs in-place `catch_unwind`).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Case-table unit tests (the repo-wide convention, already used by
# vespera_core / vespera_macro).  Test-only: never linked into the cdylib.
rstest = "0.28"
# Span/event capture for `tests/tracing_instrumentation.rs` (feature
# `tracing`): a `Registry` + a tiny collecting `Layer`.  Test-only.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

# The criterion bench runs under mimalloc (set as its `#[global_allocator]`
# in benches/dispatch.rs) to match the SHIPPED JNI cdylib, which enables
# mimalloc by default.  Measured 2026-06: the default Windows system heap
# routes per-request `Vec` allocations >= ~1 MiB through a slow
# VirtualAlloc commit/decommit path (e.g. 1 MiB `dispatch_from_bytes`
# materialise = 311 us system-heap vs 30 us mimalloc — a ~10x cliff that is
# pure harness artifact, never seen by the cdylib).  Benching under mimalloc
# keeps the large-body absolute numbers representative of production.
# Both are bench-only, so they are left out under Miri (`cargo miri` sets
# `cfg(miri)`, which Cargo also applies to target-specific dependencies):
# Miri cannot execute C code, and their C build scripts (mimalloc, criterion's
# `alloca`) would otherwise need a C cross-compiler when Miri interprets a non-host target.
[target.'cfg(not(miri))'.dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
mimalloc = "0.1"

# loom models of the shared runtime's lease gate (`src/runtime/gate.rs`) and
# the async in-flight cap shared by JNI and the C ABI (`src/runtime/in_flight.rs`).
# Only under the custom `--cfg vespera_loom` (not `cfg(loom)`, which would
# switch Tokio and friends into their own loom builds), and only in this
# crate's own unit-test build — as a dependency it keeps `std` atomics:
# RUSTFLAGS="--cfg vespera_loom" cargo test --release -p vespera_inprocess --features runtime --lib loom_
[target.'cfg(vespera_loom)'.dev-dependencies]
loom = "0.7"

[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "extreme"
harness = false

[lints]
workspace = true
