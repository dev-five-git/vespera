[package]
name = "vespera_inprocess"
version.workspace = true
edition.workspace = true
description = "In-process HTTP dispatch for axum — drive a Router via oneshot without a TCP socket"
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# `FutureExt::catch_unwind` for the `async_spawn_pattern` bench, which
# A/Bs the vespera_jni `dispatchAsync` spawn-mechanism change (inner
# `tokio::spawn` vs in-place `catch_unwind`).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[[bench]]
name = "dispatch"
harness = false

[lints]
workspace = true
