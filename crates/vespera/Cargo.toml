[package]
name = "vespera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A fully automated OpenAPI engine for Axum with zero-config route and schema discovery"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vespera"
readme.workspace = true
keywords = ["openapi", "axum", "swagger", "api", "web"]
categories = ["web-programming::http-server", "development-tools"]

[package.metadata.docs.rs]
# Document every feature-gated item (`cron`, `jni`, `inprocess`, …) and
# badge it with the feature that enables it (`doc(cfg)`).
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `validation` is on by default — `#[derive(Schema)]` automatically emits
# `impl garde::Validate` blocks and the `Validated<T>` extractor is
# available.  Opt out with `default-features = false` if you need a
# leaner build without the `garde` runtime dependency.
#
# `mimalloc` is also default-on, but it is a **weak no-op unless the
# `jni` feature is also enabled** (see the `mimalloc` feature below): a
# pure axum/OpenAPI build never compiles the mimalloc C library.  JNI
# cdylib builds get the faster global allocator automatically (~9–14%
# on the dispatch hot path); set `default-features = false` to supply
# your own `#[global_allocator]` instead.
#
# `multipart` is default-on so `TypedMultipart` / `schema_type!(..., multipart)`
# keep working out of the box; `default-features = false` drops it (and its
# tempfile / multer dependency subtree) — re-add it with `features = ["multipart"]`.
default = [
    "axum-extra/typed-header",
    "axum-extra/form",
    "axum-extra/query",
    "axum-extra/cookie",
    "multipart",
    "validation",
    "mimalloc",
]
# `multipart/form-data` support: `vespera::multipart` (`TypedMultipart`,
# `FieldData`, `NamedTempFile` uploads), `#[derive(Multipart)]` and
# `schema_type!(..., multipart)`. Pulls in tempfile, axum's / axum-extra's
# multer-based multipart extractors and tokio's fs / io-util. Without it, a
# `#[derive(Multipart)]` (also emitted by `schema_type!(..., multipart)`) is a
# compile error naming this feature.
multipart = [
    "dep:tempfile",
    "axum/multipart",
    "axum-extra/multipart",
    "tokio/fs",
    "tokio/io-util",
    "tokio/rt",
]
cron = ["tokio/rt", "tokio/time", "tokio/sync", "vespera_core/cron-chrono", "vespera_macro/cron"]
# `#[vespera::cron("...", tz = "Asia/Seoul")]`: evaluate a job in an IANA time
# zone instead of UTC (the default). Pulls in chrono-tz and its embedded tz
# database (~7 MB of generated source, compiled for the proc-macro too), so it
# is opt-in; without it `tz = ...` is a compile error.
cron-tz = ["cron", "vespera_core/cron-tz", "vespera_macro/cron-tz"]
inprocess = ["dep:vespera_inprocess", "vespera_inprocess/connect-info"]
jni = ["inprocess", "dep:vespera_jni", "vespera_inprocess/runtime"]
# Stable C ABI for non-JVM hosts (C/C++, Go, Python ctypes, .NET, Node):
# `vespera::ffi_app!` / `ffi_apps!` export `vespera_init`; the other symbols
# (`vespera_dispatch`, `vespera_dispatch_into`, `vespera_dispatch_async`,
# `vespera_free`, `vespera_shutdown`) come from `vespera_inprocess::ffi`.
# Header: `vespera_inprocess`'s `include/vespera.h`.  Shares the host runtime
# with `jni`, so one cdylib can serve both.
ffi = ["inprocess", "vespera_inprocess/ffi"]
# Structured `tracing` diagnostics (off by default): the in-process / JNI
# dispatch `vespera.dispatch` span + error/panic events (forwarded to
# `vespera_inprocess/tracing` when `inprocess` / `jni` is on — the `?` keeps
# it from pulling vespera_inprocess into a plain axum build) and the cron
# scheduler's diagnostics (job panic, overlap skip, …) as `tracing` events on
# target `vespera::cron` instead of `eprintln!`.  Install any `tracing`
# subscriber to see them.
tracing = ["dep:tracing", "vespera_inprocess?/tracing"]
# mimalloc as the cdylib's global allocator (see vespera_jni docs).
# Default-on, but the `vespera_jni?/mimalloc` weak-dep syntax means it
# only does anything when the `jni` feature has pulled in vespera_jni —
# so non-JNI builds neither set a global allocator nor compile the
# mimalloc C library.  Disable via `default-features = false` to bring
# your own allocator in a JNI cdylib.
mimalloc = ["vespera_jni?/mimalloc"]
# Runtime validation: `#[derive(Schema)]` additionally emits
# `impl garde::Validate` and the `Validated<T>` extractor is enabled.
# The `garde` crate is bundled internally and never named by user code.
validation = ["dep:garde", "dep:serde_path_to_error", "vespera_macro/validation"]

[dependencies]
vespera_core = { workspace = true }
vespera_macro = { workspace = true }
axum = { version = "0.8.4", default-features = false, features = ["form", "http1", "json", "matched-path", "original-uri", "query", "tokio"] }
axum-extra = { version = "0.12", default-features = false }
chrono = { version = "0.4.42", default-features = false, features = ["serde", "now"] }
tempfile = { version = "3", optional = true }
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0.100"
tower-layer = "0.3.3"
tower-service = "0.3.3"
# Used by the `Serve` extension trait to bind a TcpListener and drive
# axum::serve.  The `multipart` feature adds `fs` + `io-util` + `rt` so the
# multipart extractor keeps temp-file I/O off the async workers (tokio::fs
# writes, spawn_blocking).  Always present because virtually every axum
# user already has tokio in their dependency graph.
tokio = { version = "1.44", features = ["net"] }
vespera_inprocess = { workspace = true, optional = true }
vespera_jni = { workspace = true, optional = true }
# Hidden behind `validation` feature; re-exported via the private
# `vespera::__validation` module so the proc-macro can name it
# without forcing the user to add `garde` to their own Cargo.toml.
garde = { workspace = true, optional = true }
# Recovers the field path from axum's Json/Form/Query deserialization
# rejections so `Validated<T>` can report them in the 422 envelope (already in
# the graph via axum's json/form/query features).
serde_path_to_error = { version = "0.1.8", optional = true }
# `tracing` feature: cron diagnostics as `tracing` events (see the feature).
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
# Used by integration tests under `tests/` that exercise the
# `Validated<T>` extractor and the macro-emitted `garde::Validate`
# impls.  Not pulled into the production build.
serde = { version = "1.0.221", features = ["derive"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5.2", features = ["util"] }
# Integration tests for the JNI dispatch path call
# `vespera_inprocess::{register_app, dispatch_from_json}` directly so
# they don't need the `inprocess` cargo feature to be enabled.
vespera_inprocess = { workspace = true, features = ["connect-info"] }
# Byte-snapshot testing for 422 validation envelope contract
insta = "1.49"
# `Validated<T>` 422-envelope serialization before/after A/B bench.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# `derive` for the `#[derive(Validate)]` fixture; `email`/`url` for its
# field validators (the workspace `garde` is `default-features = false`).
garde = { version = "0.23", features = ["derive", "email", "url"] }
serde_json = "1.0.100"
# Compile-fail (UI) tests that assert the `#[route(responses=[...])]` and
# `#[cron("...")]` macros reject malformed input with a clean compile error
# instead of silently dropping it / panicking at runtime. See tests/ui/.
trybuild = "1"
# Table-driven integration cases (AGENTS.md: rstest for unit tests).
rstest = "0.28"

[[bench]]
name = "validation"
harness = false

# multipart `4xx`/`422` error-envelope serialization before/after A/B bench
# (same borrowing-`Serialize` win as `validation`, on `TypedMultipartError`).
[[bench]]
name = "multipart_error"
harness = false
required-features = ["multipart"]

[lints]
workspace = true
