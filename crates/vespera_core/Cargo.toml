[package]
name = "vespera_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Core types and utilities for Vespera"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vespera_core"
readme.workspace = true
keywords = ["openapi", "json-schema", "axum", "vespera"]
categories = ["web-programming", "data-structures"]

[package.metadata.docs.rs]
# Document the feature-gated `cron` module and
# badge it with the feature that enables it (`doc(cfg)`).
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Cron expression parser shared by the `#[cron]` validator and the runtime
# scheduler. `cron-chrono` adds croner's chrono backend (next-occurrence
# search), which only the runtime scheduler needs.
cron = ["dep:croner"]
cron-chrono = ["cron", "croner/chrono"]
# IANA time-zone lookup (`parse_timezone`) for `#[cron(..., tz = "...")]`.
# chrono-tz embeds the whole tz database (~7 MB of generated source), so it
# is opt-in: only crates that schedule jobs outside UTC pay for it.
cron-tz = ["cron", "dep:chrono-tz"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
croner = { version = "4", default-features = false, optional = true }
chrono-tz = { version = "0.10", optional = true }

[dev-dependencies]
insta = "1.49"
rstest = "0.28"

[lints]
workspace = true
