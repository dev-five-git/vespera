name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run: its changepacks job publishes to crates.io /
  # Maven Central / the Gradle Plugin Portal, and cancelling it mid-upload
  # leaves a partial release. Main runs queue instead; PR runs still cancel.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default: every job only reads the repository. Jobs that
# need more (the PR-comment and release jobs below) grant it explicitly.
permissions:
  contents: read

# Every third-party action is pinned to a full commit SHA (the trailing
# comment names the tag/branch it was resolved from). Tags are mutable — the
# release job holds crates.io / Maven Central / GPG / Plugin Portal secrets,
# so a re-pointed tag must never be able to run code with them. Bump a pin
# with `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>`.

jobs:
  # Local-only gates made mandatory: the `prelint` / `lint` / `test` root
  # scripts (cargo fmt + both clippy feature sets + oxlint + front tests) used
  # to run only through the husky pre-commit hook, which a contributor can
  # skip. Mirrors `bun run lint` + `bun test` exactly.
  lint:
    name: Lint (fmt, clippy, oxlint, front tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo clippy (workspace, no default features)
        run: cargo clippy --workspace --no-default-features -- -D warnings
      - name: cargo doc (deny rustdoc warnings)
        # Broken / private intra-doc links and ambiguous paths fail the build
        # here instead of surfacing only as docs.rs warnings after a release.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Version alignment
        # All seven published packages share one version; see the script.
        run: bun scripts/check-version-alignment.ts
      - name: oxlint
        # `bun run lint` would re-run the `prelint` cargo gates above; call
        # the linter it wraps directly.
        run: bunx oxlint
      - name: Front tests
        # Root bunfig.toml preloads @devup-ui/bun-plugin + bun-test-env-dom
        # (see AGENTS.md "Front tests need the bun preloads"). Also runs
        # e2e/devup-api: openapi.json → @devup-api typed client → tsc.
        run: bun test

  # The libFuzzer targets under fuzz/ are their own cargo workspace, so no
  # other job compiles them. Building (not running) them on every PR keeps
  # the fuzz harness in sync with the vespera_inprocess API it drives; the
  # weekly `fuzz.yml` workflow is what actually runs them.
  fuzz-build:
    name: Fuzz targets build (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly-2026-08-29
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz
      - name: cargo fuzz build
        # The prebuilt cargo-fuzz is a static musl binary and defaults to its
        # own target, where ASan cannot link; build for the gnu host instead.
        run: cargo fuzz build --target x86_64-unknown-linux-gnu

  # Miri: interprets the pure-Rust test suites and reports undefined
  # behaviour (out-of-bounds / uninitialised reads, invalid `set_len`,
  # aliasing violations, data races) in our `unsafe` code AND in the
  # dependencies those tests drive (bytes, http, tokio sync, arc-swap).
  # Scope: every `vespera_inprocess` unit test plus the JNI-free `unsafe`
  # helpers of `vespera_jni` (direct-buffer copy, spare-capacity fill,
  # `u8`→`jbyte` view). The shared-runtime lease gate, the async in-flight
  # cap (shared by JNI and the C ABI) and the lifecycle are
  # `vespera_inprocess` unit tests (`runtime::gate`, `runtime::in_flight`,
  # `runtime::tests`), as is the C ABI (`ffi`, raw-pointer
  # round-trips through `vespera_free`); feature `ffi` (implies `runtime`, named explicitly
  # below). The JNI symbols need a JVM and are covered by jni-e2e. A handful of tests that spawn a child process
  # or are too slow interpreted carry `#[cfg_attr(miri, ignore = "...")]`.
  # nextest runs one process per test (`.config/nextest.toml`
  # `default-miri` profile), so an unsupported operation fails that test
  # only. Gating: ~5 minutes on a runner and deterministic (isolation on,
  # fixed seed), so a regression here is a real UB report, not flake.
  miri:
    name: Miri (unsafe + data races)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly-2026-08-29
          components: miri, rust-src
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - name: cargo miri setup
        run: cargo miri setup
      - name: cargo miri nextest run
        run: >-
          cargo miri nextest run -p vespera_inprocess -p vespera_jni --lib
          --features vespera_inprocess/ffi
          -E 'package(vespera_inprocess) | (package(vespera_jni) & test(/^(jni_buf|jni_impl::direct::direct_tests)::/))'

  # loom: exhaustively explores thread interleavings (bounded preemptions)
  # of the two hand-rolled atomic protocols — the shared-runtime lease gate
  # vs the shutdown drain (`crates/vespera_inprocess/src/runtime/gate.rs`)
  # and the async in-flight cap shared by JNI `dispatchAsync` and the C ABI's
  # `vespera_dispatch_async` (`crates/vespera_inprocess/src/runtime/in_flight.rs`).
  # A custom `--cfg vespera_loom` (not `cfg(loom)`, which would flip Tokio
  # and other dependencies into their own loom builds) swaps in loom's
  # atomics; only the `loom_*` models run. Stable toolchain, < 2 minutes.
  loom:
    name: loom (atomic protocols)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: cargo test loom_ (runtime lease gate + async in-flight cap)
        env:
          RUSTFLAGS: --cfg vespera_loom
          LOOM_MAX_PREEMPTIONS: '3'
        run: cargo test --release -p vespera_inprocess --features runtime --lib loom_

  # Minimum supported Rust version of the PUBLISHED crates
  # ([workspace.package] rust-version). Examples are deliberately not held to
  # it — axum-example's sea-orm 2 / sqlx 0.9 need Rust 1.94 — so the check is
  # scoped to the five crates.io packages instead of `--workspace`.
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Keep in sync with `rust-version` in the root Cargo.toml.
          toolchain: '1.88'
      - name: cargo check (published crates, all features)
        run: >-
          cargo check --all-features
          -p vespera -p vespera_core -p vespera_macro
          -p vespera_inprocess -p vespera_jni

  # Supply-chain gate: RustSec advisories, license allowlist, banned /
  # duplicate crates and allowed sources — configured in deny.toml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  # CycloneDX SBOMs of all seven published packages (scripts/sbom.sh: the five
  # crates via a hash-pinned cargo-cyclonedx, the two Java libraries via the
  # org.cyclonedx.bom Gradle plugin). The release job regenerates them from the
  # released commit and the attest job signs them; building them here on every
  # PR is what keeps that main-only path from breaking unnoticed. No attestation and no
  # publishing happen here — the job only reads the repository.
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Generate and check SBOMs
        run: bash scripts/sbom.sh "$RUNNER_TEMP/sbom"
      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          retention-days: 14

  # Public-API semver gate for the crates.io library packages, against their
  # latest published release. Blocking — but a PR that INTENTIONALLY breaks
  # an API declares it the changepacks way: a `.changepacks/changepack_log_*.json`
  # bumping that crate's Cargo.toml to Minor (0.x: minor = breaking) or Major.
  # The declared bump is translated into cargo-semver-checks' `release-type`,
  # so a declared breaking change passes while an undeclared one fails.
  #
  # cargo-semver-checks names release types after the semver component that
  # changes in 1.x terms; for 0.y.z crates that is shifted by one position
  # (0.5 -> 0.6 is its breaking "major", 0.5.0 -> 0.5.1 may add API = "minor"):
  #
  #   changepack   0.y.z crate   >=1.0 crate
  #   Major        major         major
  #   Minor        major         minor
  #   Patch        minor         patch
  #   (none)       patch         patch
  #
  # vespera_macro is deliberately NOT checked: it is a proc-macro crate with
  # no library target, which cargo-semver-checks rejects ("no crates with
  # library targets selected"). Its public surface is the macro expansion,
  # covered by the trybuild / insta suites instead of rustdoc JSON.
  semver:
    name: cargo-semver-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Derive release type per crate from changepacks
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(.changepacks/changepack_log_*.json)
          # Resolved package versions (handles `version.workspace = true`).
          metadata=$(cargo metadata --no-deps --format-version 1)
          for crate in vespera vespera_core vespera_inprocess vespera_jni; do
            version=$(jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version' <<<"$metadata")
            if [[ -z "$version" ]]; then
              echo "::error::crate $crate not found in cargo metadata"
              exit 1
            fi
            bump=none
            if (( ${#files[@]} )); then
              bumps=$(jq -r --arg p "crates/$crate/Cargo.toml" '.changes[$p] // empty' "${files[@]}")
              if grep -qx Major <<<"$bumps"; then bump=Major
              elif grep -qx Minor <<<"$bumps"; then bump=Minor
              elif grep -qx Patch <<<"$bumps"; then bump=Patch
              fi
            fi
            if [[ "$version" == 0.* ]]; then
              case "$bump" in
                Major|Minor) level=major ;;
                Patch) level=minor ;;
                *) level=patch ;;
              esac
            else
              case "$bump" in
                Major) level=major ;;
                Minor) level=minor ;;
                *) level=patch ;;
              esac
            fi
            echo "$crate $version (changepack: $bump) -> release-type $level"
            echo "$crate=$level" >> "$GITHUB_OUTPUT"
          done
      - name: vespera_core
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: vespera_core
          release-type: ${{ steps.bump.outputs.vespera_core }}
          shared-key: semver
      - name: vespera_inprocess
        if: ${{ !cancelled() }}
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: vespera_inprocess
          release-type: ${{ steps.bump.outputs.vespera_inprocess }}
          shared-key: semver
      - name: vespera_jni
        if: ${{ !cancelled() }}
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: vespera_jni
          release-type: ${{ steps.bump.outputs.vespera_jni }}
          shared-key: semver
      - name: vespera
        if: ${{ !cancelled() }}
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: vespera
          release-type: ${{ steps.bump.outputs.vespera }}
          shared-key: semver

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: xd009642/tarpaulin:develop-nightly
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Install
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - name: Build
        run: cargo check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Deploy
        run: cargo publish --dry-run
      - name: Doctest
        # tarpaulin's --all-targets / default run never compiles doc
        # tests, which let a never-passing doctest land unnoticed —
        # run them explicitly before the (slow) coverage step.
        run: cargo test --workspace --doc
      - name: Test and enforce 100% line coverage
        run: |
          # rust coverage issue
          echo 'max_width = 100000' > .rustfmt.toml
          echo 'tab_spaces = 4' >> .rustfmt.toml
          echo 'newline_style = "Unix"' >> .rustfmt.toml
          echo 'fn_call_width = 100000' >> .rustfmt.toml
          echo 'fn_params_layout = "Compressed"' >> .rustfmt.toml
          echo 'chain_width = 100000' >> .rustfmt.toml
          echo 'merge_derives = true' >> .rustfmt.toml
          echo 'use_small_heuristics = "Default"' >> .rustfmt.toml
          cargo fmt
          cargo tarpaulin --out Lcov Stdout --engine llvm --fail-under 100
      - name: Upload to codecov.io
        uses: codecov/codecov-action@f9fe539f5290016afa014f8ef31597d3a61c2dea # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # The 100% gate above is the coverage check; a Codecov outage must
          # not fail `test` and with it block the release job that needs it.
          fail_ci_if_error: false
          files: lcov.info
        if: github.ref == 'refs/heads/main'

  # The coverage job above runs only on Linux (tarpaulin container). Path
  # handling, line endings, the trybuild UI suite and the JNI/inprocess
  # runtime all have platform-specific behaviour, so the plain test suite
  # also runs on the other two host OSes (macos-latest is arm64, so this
  # also covers aarch64).
  test-os:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: cargo test
        run: cargo test --workspace

  # OBSERVATIONAL PERCENTAGE ONLY — this job never gates on the percentage.
  # "observational" applies only to the percentage: instrumented test failures
  # still gate CI. Rust's branch instrumentation is unstable and therefore has
  # no percentage threshold.
  # (rust-lang/rust#79649), and rust-lang/rust#124118 lists as NOT yet
  # supported: match arms and or-patterns, the `?` operator, `.await`, and
  # any branch introduced by macro expansion — "the current implementation
  # discards any branch span that isn't directly visible in the function
  # body". vespera_macro owns roughly four fifths of the measured branches
  # and exists to generate code inside `quote!`, so those generated branches
  # are not reported as uncovered — they are dropped from the denominator.
  # The number therefore under-counts precisely where this codebase is most
  # complex, which is why it is a trend signal and not a pass/fail metric.
  #
  # vespera_jni is excluded for the same reason tarpaulin excludes it: it
  # cannot run without a JVM, and jni-e2e is its real coverage. Including it
  # reports ~4% branch and drowns out every other crate.
  rust-branch-coverage:
    name: Rust branch coverage (observational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly-2026-08-29
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      - name: Run instrumented tests
        # Pinned nightly keeps branch instrumentation reproducible. The
        # trybuild UI suite is blessed against stable, whose diagnostic
        # rendering can differ with nothing actually broken, so that
        # stable-specific harness alone is skipped here and still runs in Test.
        run: cargo llvm-cov --branch --workspace --no-fail-fast --no-report -- --skip ui_diagnostics
      - name: Summarise branch coverage
        run: |
          # `--branch` belongs on the instrumented RUN above, not here: the
          # profdata already carries branch counters, and `report` rejects
          # the flag.
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex '(benches|examples|vespera_jni)' \
            | tee branch-coverage.txt
          {
            echo '### Rust branch coverage (observational)'
            echo
            echo 'Excludes benches, examples and `vespera_jni` (JVM-only — covered by jni-e2e).'
            echo 'Not a gate: see the job comment in CI.yml for why this number under-counts.'
            echo
            echo '```'
            cat branch-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate lcov
        if: always()
        # The pinned nightly's `llvm-cov export -format=lcov` crashes (stack
        # dump after "N functions have mismatched data") on this workspace's
        # profdata, while `report` above succeeds. The summary is the job's
        # output; the lcov file is a convenience, so its failure must not turn
        # every main run red.
        continue-on-error: true
        run: |
          cargo llvm-cov report --lcov --output-path branch-lcov.info \
            --ignore-filename-regex '(benches|examples|vespera_jni)'
      - name: Upload branch coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-branch-coverage
          path: |
            branch-coverage.txt
            branch-lcov.info
          if-no-files-found: warn

  # Pull requests: changepacks only posts/updates its status comment
  # (`changepacks check --remote`). It never publishes on a PR, so this job
  # gets NO registry / signing secrets — only the token scope the comment
  # needs.
  changepacks-pr:
    name: changepacks (PR status)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # create / update the changepacks PR comment
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changepacks diffs against the merge-base with baseBranch (main);
          # a shallow clone has no merge-base, which breaks stacked PRs.
          fetch-depth: 0
      - uses: changepacks/action@d83fb1ec3f8844ee2726a7b8b43a8786e9a528a2 # main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # publish — runs ONLY for main (push, or a manual re-run via
  # workflow_dispatch on main), the only refs on which changepacks opens the
  # version PR / creates releases / publishes. Restricting it here means the
  # publishing secrets below are never materialised in a PR run at all.
  changepacks:
    name: changepacks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Every gate must pass before a release: a release must never ship with
    # unformatted/lint-failing code, a broken MSRV, a disallowed dependency,
    # a platform-specific test failure, or a broken JNI dispatch path on any
    # supported OS.
    needs: [lint, msrv, deny, sbom, test, test-os, jni-e2e, miri, loom]
    permissions:
      # Actions > General > Workflow permissions for creating pull request:
      # push the version branch + create GitHub releases / tags (and attach
      # the SBOMs to those releases)
      contents: write
      # open the version PR / comment on it
      pull-requests: write
      # dispatch CI on the version PR branch: pushes made with GITHUB_TOKEN
      # never trigger workflows, but `workflow_dispatch` does, so the version
      # PR gets its checks before anyone merges it
      actions: write
      # NO id-token / attestations here: this job runs third-party and build
      # code (the changepacks CLI binary, cargo build scripts, Gradle plugins),
      # none of which may mint an OIDC token or write attestations. The
      # separate `attest` job below does that.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Make gradlew executable
        # Both Java packages need their gradlew runnable — changepacks
        # invokes `./gradlew publish` from each project directory.
        run: |
          chmod +x libs/vespera-bridge/gradlew
          chmod +x libs/vespera-bridge-gradle-plugin/gradlew
      - uses: changepacks/action@d83fb1ec3f8844ee2726a7b8b43a8786e9a528a2 # main
        id: changepacks
        with:
          publish: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Maven Central (Central Portal) credentials
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # GPG signing (in-memory key, no keyring file)
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
          # Gradle Plugin Portal credentials (read natively by
          # com.gradle.plugin-publish for the `publishPlugins` task)
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      # ── Provenance + SBOM attestations (collection) ────────────────────
      # Only when changepacks actually published something in this run (its
      # `changepacks` output lists the published project paths). `!cancelled()`:
      # a partially failed publish still sets that output for what DID publish,
      # and those packages must be attested too (a re-run publishes nothing, so
      # it would never attest them). Nothing below publishes, and no registry /
      # signing secret is exposed to these steps. The files are handed to the
      # `attest` job, which alone can sign.
      - name: Collect published artifacts and SBOMs
        id: release
        if: ${{ !cancelled() && steps.changepacks.outputs.changepacks != '' && steps.changepacks.outputs.changepacks != '[]' }}
        env:
          PUBLISHED: ${{ steps.changepacks.outputs.changepacks }}
        # The exact .crate files `cargo publish` uploaded (checked against the
        # crates.io checksum) and the JARs the Gradle publish built, plus the
        # SBOMs of the released commit. See the script header.
        run: bash scripts/release-artifacts.sh "$PUBLISHED" "$RUNNER_TEMP/release"
      - name: Upload attestation subjects
        # Also after a partial collection failure: whatever was collected is
        # still attested (the failed step keeps this job red).
        if: ${{ !cancelled() && steps.release.outputs.any == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-attestation-subjects
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ !cancelled() && steps.changepacks.outcome == 'success' }}
        continue-on-error: true
        with:
          bun-version: 1.4.4
      - name: Sync the version PR and run CI on it
        # changepacks bumps the versions in Cargo.toml / build.gradle.kts but
        # not the workspace members' Cargo.lock entries nor the versions the
        # landing docs quote, so the version PR (and the release tag) would
        # carry a stale lockfile and fail main's version-alignment check right
        # after merging (0.7.0: the release did not run until the docs were
        # fixed by hand). Refresh both on that branch, then dispatch CI on it:
        # the bot's pushes trigger no workflow, so without this the version
        # PR shows no checks at all. Best effort: never blocks publish. Runs
        # whenever changepacks itself succeeded, so a failed artifact
        # collection never skips it.
        if: ${{ !cancelled() && steps.changepacks.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git fetch --depth 1 origin changepacks/main 2>/dev/null; then
            echo "no version PR branch"; exit 0
          fi
          git checkout -B changepacks/main FETCH_HEAD
          cargo update --workspace
          bun scripts/sync-landing-versions.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Sync Cargo.lock and the landing docs with the bumped versions"
            git push origin HEAD:changepacks/main
          fi
          gh workflow run CI.yml --repo "$GITHUB_REPOSITORY" --ref changepacks/main
    outputs:
      changepacks: ${{ steps.changepacks.outputs.changepacks }}
      release_assets_urls: ${{ steps.changepacks.outputs.release_assets_urls }}
      attest: ${{ steps.release.outputs.any }}

  # Provenance + SBOM attestations of what the changepacks job published. A
  # separate job so that ONLY GitHub's own attest actions run with
  # `id-token: write` / `attestations: write` (no checkout, no repository or
  # third-party code). Runs even when the changepacks job failed after a
  # partial publish; "Re-run failed jobs" re-attests from the uploaded files
  # (e.g. after a Sigstore outage) without publishing anything again.
  # Users verify with `gh attestation verify` (see SECURITY.md).
  attest:
    name: attest release
    needs: changepacks
    if: ${{ !cancelled() && needs.changepacks.outputs.attest == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # attach the SBOMs to the GitHub releases
      contents: write
      # an OIDC token for the Sigstore signing certificate, and write access
      # to the repository's attestation store
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-attestation-subjects
          path: ${{ runner.temp }}/release
      - name: Read the manifest
        id: release
        # One output pair per collected package: `<id>=<artifact>` and
        # `<id>_sbom=<sbom>` (see scripts/release-artifacts.sh).
        run: |
          dir="$RUNNER_TEMP/release"
          while IFS=$'\t' read -r _path _version id artifact sbom; do
            [[ $id =~ ^[a-z_]+$ ]] || { echo "::error::bad manifest id '$id'"; exit 1; }
            echo "$id=$dir/$artifact"
            echo "${id}_sbom=$dir/$sbom"
          done <"$dir/manifest.tsv" >>"$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release/artifacts/*
            ${{ runner.temp }}/release/sbom/*
      # One SBOM attestation per package: an SBOM attestation binds ONE SBOM
      # to its subject, so each artifact is paired with the SBOM describing it.
      - name: Attest SBOM (vespera)
        if: steps.release.outputs.vespera != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release.outputs.vespera }}
          sbom-path: ${{ steps.release.outputs.vespera_sbom }}
      - name: Attest SBOM (vespera_core)
        if: steps.release.outputs.vespera_core != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release.outputs.vespera_core }}
          sbom-path: ${{ steps.release.outputs.vespera_core_sbom }}
      - name: Attest SBOM (vespera_macro)
        if: steps.release.outputs.vespera_macro != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release.outputs.vespera_macro }}
          sbom-path: ${{ steps.release.outputs.vespera_macro_sbom }}
      - name: Attest SBOM (vespera_inprocess)
        if: steps.release.outputs.vespera_inprocess != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release.outputs.vespera_inprocess }}
          sbom-path: ${{ steps.release.outputs.vespera_inprocess_sbom }}
      - name: Attest SBOM (vespera_jni)
        if: steps.release.outputs.vespera_jni != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release.outputs.vespera_jni }}
          sbom-path: ${{ steps.release.outputs.vespera_jni_sbom }}
      - name: Attest SBOM (vespera-bridge)
        if: steps.release.outputs.vespera_bridge != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release.outputs.vespera_bridge }}
          sbom-path: ${{ steps.release.outputs.vespera_bridge_sbom }}
      - name: Attest SBOM (vespera-bridge-gradle-plugin)
        if: steps.release.outputs.vespera_bridge_gradle_plugin != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release.outputs.vespera_bridge_gradle_plugin }}
          sbom-path: ${{ steps.release.outputs.vespera_bridge_gradle_plugin_sbom }}
      - name: Attach SBOMs to the GitHub releases
        # Convenience copy for consumers (the attestations above are the
        # verifiable record). The Gradle plugin's SBOM is distributed only this
        # way: the Plugin Portal rejects JSON classifier artifacts. Best effort:
        # a missing release must not fail an already-published release run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir="$RUNNER_TEMP/release"
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          while IFS=$'\t' read -r path version _id _artifact sbom; do
            # changepacks tags: <name>(<project path>)@<version>
            tag=$(grep -F -- "($path)@$version" <<<"$releases" | grep -E -- "@${version//./\\.}$" | head -n1 || true)
            if [ -z "$tag" ]; then
              echo "::warning::no GitHub release found for $path@$version"
              continue
            fi
            gh release upload "$tag" "$dir/$sbom" --clobber --repo "$GITHUB_REPOSITORY"
          done <"$dir/manifest.tsv"

  # Java gate — builds the rust-jni-demo cdylib, runs the vespera-bridge unit
  # suite, publishes the bridge JAR to mavenLocal (so the demo-app Gradle
  # plugin can resolve kr.devfive:vespera-bridge), then runs the full
  # :demo-app:test suite (StreamingClosureStressTest + JNI dispatch tests)
  # across all three target host OSes.
  #
  # This is the ONLY thing that exercises Java in this repository, and it is
  # also what covers `crates/vespera_jni`: that crate is excluded from
  # tarpaulin (`#![cfg(not(tarpaulin_include))]`) because its symbols cannot
  # run without a JVM, so this job is its coverage — not the Rust line
  # coverage number.
  #
  # Matrix: every host OS on JDK 17 (the bridge's baseline), plus
  #   - JDK 21 / 25 (current LTS releases) on ubuntu only, to keep cost sane.
  #     The bridge itself still COMPILES for 17 (its Gradle toolchain), but
  #     demo-app has no toolchain pin, so its tests — i.e. the bridge JAR and
  #     the JNI cdylib — RUN on the matrix JDK.
  #   - ubuntu-24.04-arm: Linux aarch64 (macos-latest already covers macOS
  #     arm64), and macos-15-intel: macOS x86_64.
  #
  # Runs unconditionally on every push/PR (matching the existing CI job's
  # style — no per-job paths-filter). The whole workflow already inherits
  # the workflow-level `paths-ignore` for docs-only changes.
  jni-e2e:
    name: JNI E2E (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['17']
        include:
          - os: ubuntu-latest
            java: '21'
          - os: ubuntu-latest
            java: '25'
          - os: ubuntu-24.04-arm
            java: '17'
          - os: macos-15-intel
            java: '17'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          # JDK 17 is always installed for the bridge/plugin Gradle
          # toolchains (languageVersion 17); the LAST entry becomes JAVA_HOME
          # and therefore the JVM Gradle and demo-app's tests run on.
          java-version: |
            17
            ${{ matrix.java }}
          cache: 'gradle'
      - name: Expose JDK 17 to Gradle toolchain detection
        # setup-java installs into the tool cache, which Gradle's toolchain
        # auto-detection does not scan; point it at the env vars setup-java
        # exports (whichever arch exists on this runner).
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          echo 'org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_17_ARM64' >> "$HOME/.gradle/gradle.properties"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Build rust-jni-demo cdylib (release)
        # The vespera-bridge Gradle plugin's bundleNativeLib task copies
        # this cdylib from target/release into demo-app's resources, so it
        # must exist before `:demo-app:test` (processResources) runs.
        run: cargo build -p rust-jni-demo --release
      - name: Drive the cdylib through the C ABI (Python ctypes)
        # The only test that loads the REAL cdylib through vespera.h's
        # symbols (the Rust ffi tests link the crate statically): asserts
        # every response and exits non-zero on a mismatch. One Linux leg is
        # enough — the C ABI is platform-neutral and the JNI legs cover the
        # per-platform loading.
        if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
        run: python3 examples/rust-jni-demo/ffi/ctypes_demo.py target/release/librust_jni_demo.so
      - name: Make gradlew executable (unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x libs/vespera-bridge/gradlew
          chmod +x libs/vespera-bridge-gradle-plugin/gradlew
          chmod +x examples/rust-jni-demo/java/gradlew
      - name: Run vespera-bridge Gradle plugin tests
        # The plugin's own suite: NativePlatform OS/arch → cdylib-name
        # detection plus Gradle TestKit functional tests of the applied
        # plugin (extension defaults, bundleNativeLib wiring, bridge
        # dependency). Previously only PUBLISHED, never tested, in CI. Runs on
        # every host OS/arch (native detection is platform-specific) but only
        # on the JDK 17 legs: the plugin compiles for a JDK 17 toolchain, so
        # the 21/25 legs would repeat the same run.
        if: matrix.java == '17'
        shell: bash
        working-directory: libs/vespera-bridge-gradle-plugin
        run: ./gradlew test --console=plain --no-daemon
      - name: Publish vespera-bridge Gradle plugin to mavenLocal
        # demo-app's plugins block resolves kr.devfive.vespera-bridge from
        # mavenLocal first (settings.gradle.kts pluginManagement), pinned to
        # the version in libs/vespera-bridge-gradle-plugin/build.gradle.kts —
        # the plugin IS released to the Gradle Plugin Portal by changepacks
        # (`publishPlugins`), but CI must test the in-repo source, not the
        # last published release.
        shell: bash
        working-directory: libs/vespera-bridge-gradle-plugin
        run: ./gradlew publishToMavenLocal --console=plain --no-daemon
      - name: Run vespera-bridge unit tests
        # The bridge's own suite: wire codec, zero-copy header reader, direct
        # buffer pool, hop-by-hop header policy, dispatch-mode resolvers and
        # the Spring autoconfiguration. Until now the workflow only PUBLISHED
        # this library, so none of these ever ran in CI — the Rust side was
        # gated while ~2 kLOC of Java shipped untested. Runs before the publish
        # step so a broken bridge fails here rather than as a confusing
        # demo-app failure. Bench knobs are NOT propagated, so the
        # `vespera.bench`-gated PerfAllocBench cases stay skipped.
        shell: bash
        working-directory: libs/vespera-bridge
        run: ./gradlew test --console=plain --no-daemon
      - name: Publish vespera-bridge to mavenLocal
        # demo-app resolves kr.devfive:vespera-bridge from mavenLocal at the
        # version declared in libs/vespera-bridge/build.gradle.kts (see
        # examples/rust-jni-demo/java/demo-app/build.gradle.kts — the version
        # is read from that file, never pinned, so bumping the bridge cannot
        # silently fall back to the last release on Maven Central).
        shell: bash
        working-directory: libs/vespera-bridge
        run: ./gradlew publishToMavenLocal --console=plain --no-daemon
      - name: Run demo-app JNI E2E tests
        # Includes StreamingClosureStressTest (1000 × 1 MiB SHA256
        # bidirectional round-trip). Bench knobs are NOT propagated —
        # gated bench tests stay skipped in CI.
        shell: bash
        working-directory: examples/rust-jni-demo/java
        run: ./gradlew :demo-app:test --console=plain --no-daemon
      - name: Run demo-reactive-app WebFlux E2E tests
        # VesperaReactiveProxyHandler on reactor-netty against the same cdylib,
        # on a classpath with WebFlux but no servlet API / Spring MVC.
        shell: bash
        working-directory: examples/rust-jni-demo/java
        run: ./gradlew :demo-reactive-app:test --console=plain --no-daemon
      - name: Merge Java coverage
        # Regenerates the bridge's JaCoCo report now that demo-app has run, so
        # it also credits the classes only reachable with a loaded cdylib — the
        # JNI wrappers and the Spring proxy, which the unit suite cannot drive.
        # The report task reads demo-app/build/jacoco/test.exec
        # (and demo-reactive-app's) when present.
        shell: bash
        working-directory: libs/vespera-bridge
        run: ./gradlew jacocoTestReport --console=plain --no-daemon
      - name: Upload Java test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jni-e2e-${{ matrix.os }}-jdk${{ matrix.java }}-test-results
          path: |
            examples/rust-jni-demo/java/demo-app/build/test-results/test/*.xml
            examples/rust-jni-demo/java/demo-reactive-app/build/test-results/test/*.xml
            libs/vespera-bridge/build/test-results/test/*.xml
            libs/vespera-bridge-gradle-plugin/build/test-results/test/*.xml
            libs/vespera-bridge/build/reports/jacoco/test/jacocoTestReport.xml
