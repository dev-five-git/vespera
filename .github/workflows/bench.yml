name: Bench

# Criterion regression gate for the in-process dispatch hot path.
#
# - push to main: runs the gated bench groups as an informational smoke run.
# - pull_request: builds the PR merge base and the PR head (two separate target
#   dirs, one bench binary each), then measures them INTERLEAVED in this one job
#   on this one runner: 5 rounds alternating base,head / head,base / ... with
#   per-side CRITERION_HOME. The job FAILS when a bench's median PAIRED change
#   (head/base - 1 within a round) exceeds +30% AND every one of the 5 paired
#   rounds exceeds +20% (min of N paired samples = the one-sided sign-test
#   lower confidence limit of the median, 96.875% for N=5). See the header of
#   scripts/bench-interleaved.sh for the full method and why a shared/prebuilt
#   target dir would silently benchmark one binary against itself.
# - Cargo.toml / Cargo.lock remain triggers so dependency/profile changes are
#   covered, but a PR whose only relevant edits are version assignments (the
#   workspace release version in Cargo.toml and the workspace members'
#   `version` entries in Cargo.lock, which every version PR rewrites) is
#   skipped.
#
# Why interleaved: runner conditions drift on a minutes scale, so measuring the
# baseline in one block and the PR in a later block turned drift into fake
# regressions (two back-to-back runs of PR #144, whose merge base and head hold
# byte-identical Rust, swung -12.33%..+14.92% and tripped a DIFFERENT bench
# each time). Pairing each head measurement with a base measurement taken
# seconds apart cancels that drift, and requiring the +20% floor in every
# round means one noisy round cannot trip the gate while a real >30% slowdown
# (present in every round) still does. The thresholds are unchanged.
#
# Gated groups are the stable per-request paths (wire_path,
# headers_path, request_headers_path, resolve_path, dispatch_path). The
# streaming and contended groups are noisier (spawn_blocking / scheduler
# timing) and the router_path setup micro-bench is low-signal, so those
# are validated locally instead (`cargo bench -p vespera_inprocess --bench
# dispatch -- <group>`).
#
# Small, deterministic ALLOCATION regressions are caught noise-free by the
# `alloc_budget` integration test (a counting global allocator asserting exact
# per-dispatch allocation budgets) in the normal `cargo test` job — the two
# gates are complementary.

on:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bench.yml'
      - 'scripts/bench-interleaved.sh'
  pull_request:
    paths:
      - 'crates/**'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bench.yml'
      - 'scripts/bench-interleaved.sh'

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only check out and build.
permissions:
  contents: read

env:
  BENCH_FILTER: 'wire_path|headers_path|request_headers_path|resolve_path|dispatch_path'

jobs:
  bench:
    name: Criterion regression gate
    runs-on: ubuntu-latest
    # Two release builds + 5 x 2 interleaved runs; the default (6 h) would let
    # a hung bench hold a runner for hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Determine PR benchmark scope
        if: github.event_name == 'pull_request'
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"

          should_run=false
          while IFS= read -r path; do
            case "$path" in
              crates/*|.cargo/*|rust-toolchain*|.github/workflows/bench.yml|scripts/bench-interleaved.sh)
                should_run=true
                ;;
            esac
          done < <(git diff --name-only "$merge_base" "$HEAD_SHA")

          # Compare parsed TOML after removing only changepacks-managed release
          # versions (Cargo.toml: the workspace version and the internal crates'
          # path-dependency versions; Cargo.lock: the `version` of source-less
          # packages, i.e. workspace members). External dependency versions,
          # profiles, features, lockfile resolutions, and any unparseable
          # change fail safe by keeping the gate enabled.
          if ! python3 - "$merge_base" "$HEAD_SHA" <<'PY'
          import copy
          import subprocess
          import sys
          import tomllib


          def toml_at(revision, path):
              contents = subprocess.check_output(
                  ["git", "show", f"{revision}:{path}"],
                  text=True,
                  encoding="utf-8",
              )
              return tomllib.loads(contents)


          def without_release_versions(document):
              normalized = copy.deepcopy(document)
              workspace = normalized.get("workspace")
              if not isinstance(workspace, dict):
                  return normalized

              package = workspace.get("package")
              if isinstance(package, dict):
                  package.pop("version", None)

              dependencies = workspace.get("dependencies")
              if isinstance(dependencies, dict):
                  for name, spec in dependencies.items():
                      if not isinstance(spec, dict):
                          continue
                      if spec.get("path") == f"crates/{name}":
                          spec.pop("version", None)

              return normalized


          def without_member_versions(lockfile):
              normalized = copy.deepcopy(lockfile)
              for package in normalized.get("package", []):
                  if isinstance(package, dict) and "source" not in package:
                      package.pop("version", None)
              return normalized


          base_rev, head_rev = sys.argv[1], sys.argv[2]
          version_only = without_release_versions(
              toml_at(base_rev, "Cargo.toml")
          ) == without_release_versions(toml_at(head_rev, "Cargo.toml"))
          version_only = version_only and without_member_versions(
              toml_at(base_rev, "Cargo.lock")
          ) == without_member_versions(toml_at(head_rev, "Cargo.lock"))
          print(f"cargo_version_only={str(version_only).lower()}")
          raise SystemExit(0 if version_only else 1)
          PY
          then
            echo "::notice::Could not prove Cargo.toml / Cargo.lock changes are version-only; keeping the performance gate enabled."
            should_run=true
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Skip version-only PR
        if: github.event_name == 'pull_request' && steps.scope.outputs.should_run != 'true'
        run: echo "::notice::The only benchmark-relevant edits are Cargo.toml version assignments; skipping the performance gate."

      - name: Run benchmark smoke test on main
        if: github.event_name == 'push'
        run: cargo bench -p vespera_inprocess --bench dispatch -- "${BENCH_FILTER}"

      - name: Interleaved merge-base vs PR head benchmark gate
        if: github.event_name == 'pull_request' && steps.scope.outputs.should_run == 'true'
        env:
          MERGE_BASE: ${{ steps.scope.outputs.merge_base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Pin code layout in BOTH builds. Under fat LTO + one codegen unit,
          # an unrelated change elsewhere in the crate shifts function / loop
          # alignment, and the body-copy loops behind the 64 KiB / 1 MiB cases
          # swung +40% on identical buffered-path code (PR #161: commits
          # 69d007d and 7a7afe4 regressed, a6cd337 between them did not).
          # With every function aligned to 64 B and every non-fallthrough
          # block to 32 B the same head measured within +/-2% of its base.
          # Absolute numbers differ slightly from a release build; the gate
          # only compares the two sides, which are built identically.
          RUSTFLAGS: "-C llvm-args=-align-all-functions=6 -C llvm-args=-align-all-nofallthru-blocks=5"
        run: |
          git checkout --detach "$HEAD_SHA"
          scripts/bench-interleaved.sh "$MERGE_BASE" "${BENCH_FILTER}"
